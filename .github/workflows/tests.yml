name: Tests

on:
  push:
    branches: [main, m1-executable-intelligence]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python tooling
        run: python -m py_compile tools/gtdecomp.py tools/gtcatalog.py tools/gtverify.py tools/ghidra/apply_gtdecomp_index.py tools/ghidra/export_decompilation.py
      - name: Validate research catalog
        run: python tools/gtcatalog.py validate analysis
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run reconstructed C tests
        run: |
          set -eu
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Isrc/startup \
            src/startup/gt5_vector_normalize.c tests/test_gt5_vector_normalize.c \
            -o "$tmp/gt5_vector_normalize"
          "$tmp/gt5_vector_normalize"
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Isrc/startup \
            src/startup/gt5_dispatch_walker.c tests/test_gt5_dispatch_walker.c \
            -o "$tmp/gt5_dispatch_walker"
          "$tmp/gt5_dispatch_walker"
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Isrc/startup \
            src/startup/gt5_keyed_config.c tests/test_gt5_keyed_config.c \
            -o "$tmp/gt5_keyed_config"
          "$tmp/gt5_keyed_config"
