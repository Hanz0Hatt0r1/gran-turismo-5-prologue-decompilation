name: Tests

on:
  push:
    branches: [main, m1-executable-intelligence]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python tooling
        run: python -m py_compile tools/gtdecomp.py tools/gtcatalog.py tools/ghidra/apply_gtdecomp_index.py tools/ghidra/export_decompilation.py
      - name: Validate research catalog
        run: python tools/gtcatalog.py validate analysis
      - name: Run unit tests
        run: python -m unittest discover -s tests -v