name: Tests\n\non:\n  push:\n    branches: [main, m1-executable-intelligence]\n  pull_request:\n\njobs:\n  python:\n    runs-on: ubuntu-latest\n    strategy:\n      matrix:\n        python-version: ["3.10", "3.11", "3.12"]\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: ${{ matrix.python-version }}\n      - name: Compile Python tooling\n        run: python -m py_compile tools/gtdecomp.py tools/gtcatalog.py tools/ghidra/apply_gtdecomp_index.py tools/ghidra/export_decompilation.py\n      - name: Run unit tests\n        run: python -m unittest discover -s tests -v\n